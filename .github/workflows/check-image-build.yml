name: Check Image Build

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [ "main", "release/**", "develop" ]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'deployment-examples/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      runner: ${{ steps.changes.outputs.runner }}
      plugins: ${{ steps.changes.outputs.plugins }}
      justflow: ${{ steps.changes.outputs.justflow }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
            backend:
              - 'apps/backend/**'
            runner:
              - 'apps/runner/**'
              - 'apps/backend/**'
              - 'go.work'
            plugins:
              - 'runner-plugins/**'
              - 'apps/backend/**'
              - 'apps/runner/**'
              - 'go.work'
            justflow:
              - 'apps/frontend/**'
              - 'apps/backend/**'
              - 'Dockerfile'
              - 'entrypoint.sh'
  frontend:
    name: Check Standalone Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build apps/frontend --file apps/frontend/Dockerfile --tag justnz/justflow:frontend-test
  backend:
    name: Check Standalone Backend Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build apps/backend --file apps/backend/Dockerfile --tag justnz/justflow:backend-test
  runner:
    name: Check Runner Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.runner == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Runner Docker Image
        run: docker build . --file apps/runner/Dockerfile --tag justnz/runner:test
  plugins:
    name: Check Plugins Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.plugins == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Build Plugin Modules
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            plugin_dir=$(dirname "$modfile")
            echo "Building ${plugin_dir}"
            (
              cd "$plugin_dir"
              go build ./...
            )
          done < <(find runner-plugins -name go.mod | sort)
  justflow:
    name: Check justFlow Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.justflow == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build justFlow Docker Image
        run: docker build . --file Dockerfile --tag justnz/justflow:test