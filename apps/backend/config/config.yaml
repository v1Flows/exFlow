---

log_level: info

port: 8080

database:
  server: localhost
  port: 5432
  name: postgres
  user: postgres
  password: postgres

encryption:
  # Minimum 32 characters, recommended 64+ characters
  master_secret: "your-very-long-and-secure-master-secret-here"
  # Fallback key for legacy data (optional)
  key: "legacy-key-for-backward-compatibility"

jwt:
  secret: null

runner:
  shared_runner_secret: null
  # Token expiration in days (default: 365). Reduce for tighter security.
  token_expiration_days: 365
